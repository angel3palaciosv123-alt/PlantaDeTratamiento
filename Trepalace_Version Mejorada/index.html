<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Trepalace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<!-- =======================================================
   COLORES
   ======================================================= -->
<!-- =======================================================
   ESTILOS DE VENTANA, LOGIN Y MODULOS DE DISEÑO
   ======================================================= -->
<link rel="stylesheet" href="css/estilos.css">
</head>

<!-- =======================================================
   DISEÑO DE PLATAFORMA COMPLETO CUERPO
   ======================================================= -->
<body>

<!-- =======================================================
   INICIO DE SESION
   ======================================================= -->
<div id="login-wrap">
  <div id="login-card">
    <div class="lg" data-logo></div>
    <h2>TREPALACE</h2>
    <div class="sub">SOLUCIONES AMBIENTALES PARA TUS PROYECTOS<br>BASADOS EN TUS NECESIDADES</div>
    <label>USUARIO</label><input id="lg-u" autocomplete="username">
    <label>CONTRASEÑA</label><input id="lg-p" type="password" autocomplete="current-password">
    <div id="login-err"></div>
    <button class="btn btn-primary" style="margin-top:18px" onclick="lgEntrar()">INICIAR SESIÓN</button>
      </div>
</div>

<!-- =======================================================
   ESTILOS DE VENTANA, LOGIN Y MODULOS DE DISEÑO
   ======================================================= -->
<!-- =======================================================
   BARRA LATERAL
   ======================================================= -->
<header class="m-bar" id="m-bar"><button class="sb-burger" id="sb-burger" aria-label="Abrir menú" aria-controls="topbar" aria-expanded="false" onclick="sbAbrirMovil()"><span data-ic="menu"></span></button><strong>TREPALACE</strong><span id="m-title"></span></header>
<div class="sb-scrim" id="sb-scrim" onclick="sbCerrarMovil()"></div>
<aside class="sb" id="topbar" aria-label="Navegación principal">
  <div class="sb-head"><div class="sb-logo" data-logo></div><div class="sb-brand"><strong>TREPALACE</strong><span>Diseño de plantas de tratamiento de aguas residuales</span></div>
    <button class="sb-collapse" id="sb-collapse" onclick="sbAlternar()" aria-expanded="true" aria-label="Contraer menú" title="Contraer menú"><span data-ic="colapsar"></span></button></div>
  <nav class="sb-scroll">
    <button class="tab-btn" id="tab-inicio" data-t="Inicio" title="Inicio" onclick="irVista('inicio')"><span class="ic" data-ic="inicio"></span><span class="lb">Inicio</span></button>
  </nav>
  <div class="sb-foot"><div class="lbl">Cuenta</div><div class="sb-usr"><div class="sb-av" id="sb-av">?</div><div class="sb-who"><span class="tb-user" id="tb-user"></span><small id="sb-ses">Sesión activa</small></div>
    <button class="tb-out" onclick="lgSalir()" title="Cerrar sesión" aria-label="Cerrar sesión"><span data-ic="salir"></span><span class="lb">Salir</span></button></div></div>
</aside>
<div class="ui-toast" id="ui-toast" role="status" aria-live="polite"></div>

<!-- Las vistas de cada módulo se generan dinámicamente desde MODULOS (navegacion.js) -->


<!-- Ventana informativa / de confirmación -->
<div class="overlay" id="overlay">
  <div class="modal-box" id="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-msg">
    <div class="md-head"><span class="md-ico" id="modal-ico"></span><h3 id="modal-title"></h3></div>
    <p id="modal-msg"></p>
    <div class="md-actions"><button class="btn btn-cancel" onclick="cerrarModal()">Cancelar</button><button class="btn btn-ok" id="modal-ok" onclick="modalAceptar()">Aceptar</button></div>
  </div>
</div>

<!-- Scripts clásicos, orden fijo (apertura local file://, sin servidor) -->
<!-- 1. Núcleo (sin datos ni reglas de módulos) -->
<script src="js/nucleo/configuracion.js"></script>
<script src="js/nucleo/utilidades.js"></script>
<script src="js/nucleo/campos.js"></script>
<script src="js/nucleo/registro_modulos.js"></script>
<script src="js/nucleo/almacenamiento.js"></script>
<script src="js/nucleo/revision.js"></script>
<script src="js/nucleo/memoria.js"></script>
<script src="js/nucleo/svg_comun.js"></script>
<script src="js/nucleo/sesion.js"></script>
<script src="js/nucleo/navegacion.js"></script>

<!-- 2. Módulos generales: únicos dueños de tablas y de términos de referencia -->
<script src="js/modulos/datos_preliminares/tablas.js"></script>
<script src="js/modulos/datos_preliminares/datos_preliminares.js"></script>
<script src="js/modulos/terminos_referencia/rangos.js"></script>
<script src="js/modulos/terminos_referencia/tarjetas.js"></script>
<script src="js/modulos/terminos_referencia/terminos_referencia.js"></script>

<!-- 3. Módulos de cálculo (SVG antes de la lógica cuando aplica) -->
<script src="js/modulos/proyeccion_poblacional/dane_datos.js"></script>
<script src="js/modulos/proyeccion_poblacional/proyeccion_poblacional.js"></script>
<script src="js/modulos/caudal/caudal.js"></script>
<script src="js/modulos/rejilla/rejilla_svg.js"></script>
<script src="js/modulos/rejilla/rejilla.js"></script>
<script src="js/modulos/aduccion/aduccion_svg.js"></script>
<script src="js/modulos/aduccion/aduccion.js"></script>
<script src="js/modulos/desarenador/desarenador_svg.js"></script>
<script src="js/modulos/desarenador/desarenador.js"></script>
<script src="js/modulos/parshall/parshall_svg.js"></script>
<script src="js/modulos/parshall/parshall.js"></script>
<script src="js/modulos/proximos/proximos.js"></script>
<!-- Módulo nuevo: agregar aquí sus scripts (ver js/modulos/plantilla/modulo_plantilla.js) -->

<!-- 4. Arranque -->
<script src="js/nucleo/inicializacion.js"></script>

</body>
</html>
